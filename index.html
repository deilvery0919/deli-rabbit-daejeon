<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>딜리래빗 대전 관제 대시보드</title>
  
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 사이드바 / 제어판 -->
    <aside class="sidebar">
      <div class="brand">
        <i class="fa-solid fa-bolt brand-icon"></i>
        <div>
          <h2>DELI RABBIT</h2>
          <span class="sub-title">대전 현장 배차 관제</span>
        </div>
      </div>

      <!-- 바코드 스캔 입력 섹션 (실시간 연동 테스트) -->
      <div class="scan-box">
        <label for="scan-input"><i class="fa-solid fa-barcode"></i> 실시간 바코드 스캔</label>
        <div class="scan-input-wrapper">
          <input type="text" id="scan-input" placeholder="운송장 번호 스캔 / Enter..." autofocus>
          <button id="scan-btn"><i class="fa-solid fa-check"></i></button>
        </div>
        <p class="scan-tip">* ID(예: DL-YUS-001) 입력 후 엔터 누르면 즉시 스캔 처리됩니다.</p>
      </div>

      <!-- 검색 & 상세 필터 -->
      <div class="filter-box">
        <div class="input-group">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="기사명, 주소, 코드 검색">
        </div>
        <div class="select-group">
          <select id="sector-filter">
            <option value="ALL">전체 지역/코드</option>
          </select>
        </div>
      </div>

      <!-- 배차 목록 -->
      <div class="list-header">
        <span>배차 목록</span>
        <span class="list-count" id="filtered-count">0건</span>
      </div>
      <ul id="delivery-list" class="delivery-list"></ul>
    </aside>

    <!-- 메인 대시보드 영역 -->
    <main class="main-content">
      <!-- 구 선택 탭 버튼 -->
      <div class="top-nav">
        <div class="district-tabs">
          <button class="tab-btn active" data-district="ALL">전체 구</button>
          <button class="tab-btn" data-district="유성구">유성구 (200)</button>
          <button class="tab-btn" data-district="동구">동구 (300)</button>
          <button class="tab-btn" data-district="대덕구">대덕구 (400)</button>
        </div>
      </div>

      <!-- 시각화 스탯 카운터 (다운카운트 대시보드) -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon total"><i class="fa-solid fa-boxes-stacked"></i></div>
          <div class="stat-info">
            <span class="label">총 배차 물량</span>
            <span class="value" id="total-count">0</span>
          </div>
        </div>

        <div class="stat-card highlight">
          <div class="stat-icon remaining"><i class="fa-solid fa-truck-ramp-box"></i></div>
          <div class="stat-info">
            <span class="label">남은 미스캔 수량</span>
            <span class="value down-counter" id="unscanned-count">0</span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon completed"><i class="fa-solid fa-circle-check"></i></div>
          <div class="stat-info">
            <span class="label">스캔 완료</span>
            <span class="value" id="scanned-count">0</span>
          </div>
        </div>

        <div class="stat-card progress-card">
          <div class="progress-info">
            <span class="label">스캔 진행률</span>
            <span class="progress-percent" id="progress-text">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>
        </div>
      </div>

      <!-- 지도 섹션 -->
      <div class="map-container">
        <div id="map"></div>
      </div>
    </main>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
